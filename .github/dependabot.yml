version: 2

# No `registries:` block is needed. Every dependency resolves from Maven
# Central.

updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - java
    # com.regnosys and Rune artifacts are bumped deliberately as part of
    # release coordination, not by a bot.
    # xtext-dev-bom and guava are kept off minor/major bumps entirely -
    # only patch updates are allowed through, and standalone rather than
    # grouped.
    ignore:
      - dependency-name: com.regnosys*
      - dependency-name: org.finos.rune*
      # maven-artifact.version is pinned to match what rune-maven-plugin
      # (via maven-plugin-api) resolves it to at the current rune.dsl.version -
      # a value only a human tracing that chain can set correctly, not a bot.
      - dependency-name: org.apache.maven:maven-artifact
      # plexus-utils.version overrides the transitive version pulled in via
      # maven-plugin-api to fix CVE-2025-67030 - needs to stay reviewed by a
      # human, not bumped independently by a bot.
      - dependency-name: org.codehaus.plexus:plexus-utils
      - dependency-name: org.eclipse.xtext:xtext-dev-bom
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: com.google.guava:guava
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      # Guice stays on major version 6 - minor/patch updates are fine.
      - dependency-name: com.google.inject*
        update-types:
          - version-update:semver-major
    # One PR for routine minor/patch drift; majors still come through
    # individually so they get read properly.
    groups:
      maven-minor-and-patch:
        exclude-patterns:
          - org.eclipse.xtext:xtext-dev-bom
          - com.google.guava:guava
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
